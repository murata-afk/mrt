<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SHOOTER</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;
    font-family:"Segoe UI",monospace;color:#0ff;}
  #wrap{display:flex;justify-content:center;align-items:center;height:100%;}
  canvas{background:radial-gradient(circle at 50% 30%,#0a1030,#05060f 70%);
    border:2px solid #0ff;border-radius:10px;
    box-shadow:0 0 25px #0ff,0 0 60px #06f inset;touch-action:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="640"></canvas></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let keys={},state='play',score=0,lives=3,elapsed=0;
let player,bullets,enemies,ebullets,parts,spawnT,shootCd;

function reset(){
  player={x:W/2,y:H-70,r:14,cd:0};
  bullets=[];enemies=[];ebullets=[];parts=[];
  score=0;lives=3;elapsed=0;spawnT=0;state='play';
}
reset();

addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(state==='over'&&(e.key===' '||e.key==='Enter'))reset();
});
addEventListener('keyup',e=>keys[e.key]=false);

// 見えない間は自動ポーズ
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(state==='play')state='pause';}
  else{if(state==='pause'){state='play';last=performance.now();}}
});

function spawn(){
  const speed=1+elapsed/25;
  enemies.push({x:30+Math.random()*(W-60),y:-20,r:14,
    vx:(Math.random()-.5)*speed,vy:speed*(.6+Math.random()*.5),
    hue:(Math.random()*120+280)%360,fire:Math.random()*2+1});
}
function boom(x,y,hue){
  for(let i=0;i<14;i++){const a=Math.random()*6.28,s=Math.random()*3+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue});}
}

function update(dt){
  elapsed+=dt;
  // 自機
  const sp=4.2;
  if(keys.ArrowLeft)player.x-=sp;
  if(keys.ArrowRight)player.x+=sp;
  if(keys.ArrowUp)player.y-=sp;
  if(keys.ArrowDown)player.y+=sp;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(H/2,Math.min(H-player.r,player.y));
  player.cd-=dt;
  if(keys[' ']&&player.cd<=0){bullets.push({x:player.x,y:player.y-16,vy:-9});player.cd=.16;}

  // 出現（時間で加速）
  spawnT-=dt;
  const rate=Math.max(.35,1.1-elapsed/45);
  if(spawnT<=0){spawn();spawnT=rate;}

  bullets.forEach(b=>b.y+=b.vy);
  bullets=bullets.filter(b=>b.y>-20);

  enemies.forEach(e=>{
    e.x+=e.vx;e.y+=e.vy;
    if(e.x<e.r||e.x>W-e.r)e.vx*=-1;
    e.fire-=dt;
    if(e.fire<=0&&e.y<H-100){ebullets.push({x:e.x,y:e.y+14,vy:2.5+elapsed/60});e.fire=Math.random()*2+1.2;}
  });

  ebullets.forEach(b=>b.y+=b.vy);
  ebullets=ebullets.filter(b=>b.y<H+20);

  // 弾×敵
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){
        boom(e.x,e.y,e.hue);enemies.splice(i,1);bullets.splice(j,1);score+=10;break;
      }
    }
  }
  // 敵×自機 / 敵弾×自機
  const hit=()=>{lives--;boom(player.x,player.y,180);player.x=W/2;player.y=H-70;
    enemies=[];ebullets=[];if(lives<=0)state='over';};
  for(let i=enemies.length-1;i>=0;i--){
    if(Math.hypot(enemies[i].x-player.x,enemies[i].y-player.y)<enemies[i].r+player.r){enemies.splice(i,1);hit();break;}
  }
  for(let i=ebullets.length-1;i>=0;i--){
    if(Math.hypot(ebullets[i].x-player.x,ebullets[i].y-player.y)<player.r+3){ebullets.splice(i,1);hit();break;}
  }
  // 画面外に逃した敵は消す（ペナルティなし）
  enemies=enemies.filter(e=>e.y<H+30);

  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*1.6;});
  parts=parts.filter(p=>p.life>0);
}

function glow(fn,color,blur){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=blur;fn();ctx.restore();}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 弾
  bullets.forEach(b=>glow(()=>{ctx.fillStyle='#0ff';ctx.fillRect(b.x-2,b.y-8,4,12);},'#0ff',12));
  ebullets.forEach(b=>glow(()=>{ctx.fillStyle='#f0a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill();},'#f0a',12));
  // 敵
  enemies.forEach(e=>glow(()=>{
    ctx.strokeStyle=`hsl(${e.hue},100%,65%)`;ctx.fillStyle=`hsla(${e.hue},100%,55%,.25)`;ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);ctx.closePath();
    ctx.fill();ctx.stroke();
  },`hsl(${e.hue},100%,60%)`,15));
  // 自機
  glow(()=>{
    ctx.strokeStyle='#0ff';ctx.fillStyle='rgba(0,255,255,.25)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(player.x,player.y-player.r);
    ctx.lineTo(player.x+player.r,player.y+player.r);
    ctx.lineTo(player.x,player.y+player.r*.5);
    ctx.lineTo(player.x-player.r,player.y+player.r);
    ctx.closePath();ctx.fill();ctx.stroke();
  },'#0ff',15);
  // 破片
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);
    glow(()=>{ctx.fillStyle=`hsl(${p.hue},100%,65%)`;ctx.fillRect(p.x-2,p.y-2,4,4);},`hsl(${p.hue},100%,65%)`,10);
    ctx.globalAlpha=1;});
  // HUD
  ctx.fillStyle='#0ff';ctx.font='16px monospace';ctx.textAlign='left';
  ctx.fillText('SCORE '+score,12,24);
  ctx.textAlign='right';
  ctx.fillText('LIVES '+'♥'.repeat(Math.max(0,lives)),W-12,24);
  ctx.textAlign='center';ctx.fillStyle='rgba(0,255,255,.5)';ctx.font='12px monospace';
  ctx.fillText('← → ↑ ↓ 移動   SPACE 発射',W/2,H-10);

  if(state==='pause'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0ff';ctx.font='24px monospace';ctx.textAlign='center';
    ctx.fillText('PAUSED（タブを戻すと再開）',W/2,H/2);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    glow(()=>{ctx.fillStyle='#f0a';ctx.font='bold 44px monospace';ctx.fillText('GAME OVER',W/2,H/2-40);},'#f0a',20);
    ctx.fillStyle='#0ff';ctx.font='20px monospace';ctx.fillText('SCORE  '+score,W/2,H/2+2);
    // ボタン
    const bx=W/2-90,by=H/2+40,bw=180,bh=48;
    glow(()=>{ctx.strokeStyle='#0ff';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);},'#0ff',15);
    ctx.fillStyle='#0ff';ctx.font='18px monospace';ctx.fillText('▶ もう一度あそぶ',W/2,by+31);
    ctx.fillStyle='rgba(0,255,255,.6)';ctx.font='12px monospace';
    ctx.fillText('クリック / SPACE でリスタート',W/2,by+bh+22);
    cv._btn={bx,by,bw,bh};
  }
}

cv.addEventListener('click',e=>{
  if(state!=='over'||!cv._btn)return;
  const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
  const b=cv._btn;
  if(mx>=b.bx&&mx<=b.bx+b.bw&&my>=b.by&&my<=b.by+b.bh)reset();
});

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1; // タブ復帰時の暴走防止
  if(state==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
